server.port=8080

# H2 Database Configuration
# 使用文件数据库模式,数据持久化保存到磁盘
spring.datasource.url=jdbc:h2:file:./data/virtualchat
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 千问百炼（通义千问）API配置
# 聊天和图像生成使用同一个API Key
# 获取API密钥: https://dashscope.console.aliyun.com/
spring.ai.dashscope.api-key=你的key

# 聊天模型配置
spring.ai.dashscope.chat.options.model=qwen-turbo

# 图片生成模型配置
# 可选模型: wanx-v1, wanx-lite, wanx-plus
image.generation.model=wanx-v1
image.generation.size=1024*1024
# 阿里云账号AccessKey
