<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟社交聊天</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .welcome-container {
            background: white;
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        .welcome-title {
            color: #333;
            margin-bottom: 20px;
        }
        .welcome-text {
            color: #666;
            margin-bottom: 30px;
        }
        .btn-start {
            padding: 12px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
        }
        .btn-start:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1 class="welcome-title">欢迎使用虚拟社交聊天</h1>
        <p class="welcome-text">
            创建您的虚拟朋友，与AI智能对话<br>
            体验个性化的聊天互动
        </p>
        <a href="/login" class="btn btn-start">开始使用</a>
    </div>
</body>
</html>
