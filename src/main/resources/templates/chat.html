<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟社交聊天</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
        }
        
        /* 左侧好友列表 */
        .sidebar {
            width: 300px;
            background: #f5f5f5;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            background: #07c160;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-header h3 {
            margin: 0;
            font-size: 18px;
        }
        
        .btn-add-friend {
            background: white;
            color: #07c160;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-add-friend:hover {
            background: #f0f0f0;
        }
        
        .friend-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .friend-item {
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .friend-item:hover {
            background: #e8e8e8;
        }
        
        .friend-item.active {
            background: #d9d9d9;
        }
        
        .friend-name {
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .friend-info {
            font-size: 12px;
            color: #999;
        }
        
        /* 右侧聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }
        
        .chat-header {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-header h4 {
            margin: 0;
        }
        
        .btn-edit-friend {
            background: transparent;
            border: 1px solid #07c160;
            color: #07c160;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .btn-edit-friend:hover {
            background: #07c160;
            color: white;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.friend {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 10px;
            word-wrap: break-word;
        }
        
        .message.user .message-bubble {
            background: #95ec69;
            color: #000;
        }
        
        .message.friend .message-bubble {
            background: white;
            color: #000;
        }
        
        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }
        
        .input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }
        
        .input-area input:focus {
            border-color: #07c160;
        }
        
        .btn-send {
            padding: 10px 25px;
            background: #07c160;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .btn-send:hover {
            background: #06ad56;
        }
        
        .btn-send:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .no-chat-selected {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 16px;
        }
        
        /* Modal样式 */
        .modal-header {
            background: #07c160;
            color: white;
        }
        
        .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }
        
        /* 数字人视频窗口样式 */
        .avatar-window {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 280px;
            height: 360px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow: hidden;
            cursor: move;
        }
        
        .avatar-window.show {
            display: flex;
        }
        
        .avatar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }
        
        .avatar-header h6 {
            margin: 0;
            font-size: 14px;
        }
        
        .avatar-controls {
            display: flex;
            gap: 8px;
        }
        
        .avatar-controls button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .avatar-controls button:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .avatar-video-container {
            flex: 1;
            background: #1a1a2e;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .avatar-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .avatar-placeholder {
            color: #999;
            text-align: center;
            padding: 20px;
        }
        
        .avatar-status {
            padding: 8px 15px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }
        
        .status-dot.active {
            background: #07c160;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧好友列表 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3><i class="bi bi-chat-dots"></i> 虚拟朋友</h3>
                <button class="btn-add-friend" onclick="showAddFriendModal()">
                    <i class="bi bi-plus"></i> 添加
                </button>
            </div>
            <div class="friend-list" id="friendList">
                <!-- 好友列表将在这里动态加载 -->
            </div>
        </div>
        
        <!-- 右侧聊天区域 -->
        <div class="chat-area" id="chatArea">
            <div class="no-chat-selected">
                <p>请选择一个好友开始聊天</p>
            </div>
        </div>
    </div>

    <!-- 数字人视频窗口 -->
    <div class="avatar-window" id="avatarWindow">
        <div class="avatar-header" id="avatarHeader">
            <h6><i class="bi bi-camera-video"></i> AI数字人</h6>
            <div class="avatar-controls">
                <button onclick="minimizeAvatar()" title="最小化"><i class="bi bi-dash"></i></button>
                <button onclick="closeAvatar()" title="关闭"><i class="bi bi-x"></i></button>
            </div>
        </div>
        <div class="avatar-video-container">
            <div class="avatar-placeholder" id="avatarPlaceholder">
                <i class="bi bi-person-video" style="font-size: 48px; display: block; margin-bottom: 10px;"></i>
                <div>数字人视频中...</div>
                <small style="color: #999;">正在连接</small>
            </div>
            <video id="avatarVideo" autoplay playsinline style="display: none;"></video>
        </div>
        <div class="avatar-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">未连接</span>
        </div>
    </div>

    <!-- 添加/编辑好友模态框 -->
    <div class="modal fade" id="friendModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">添加好友</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="friendForm">
                        <input type="hidden" id="friendId">
                        <div class="mb-3">
                            <label for="friendName" class="form-label">姓名 *</label>
                            <input type="text" class="form-control" id="friendName" required>
                        </div>
                        <div class="mb-3">
                            <label for="friendAge" class="form-label">年龄</label>
                            <input type="number" class="form-control" id="friendAge" min="1" max="150">
                        </div>
                        <div class="mb-3">
                            <label for="friendGender" class="form-label">性别</label>
                            <select class="form-select" id="friendGender">
                                <option value="男">男</option>
                                <option value="女">女</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="friendPersonality" class="form-label">性格特征</label>
                            <textarea class="form-control" id="friendPersonality" rows="2" placeholder="例如：开朗、幽默、温柔"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="friendCharacteristics" class="form-label">主要人物特点描述</label>
                            <textarea class="form-control" id="friendCharacteristics" rows="3" placeholder="详细描述这个虚拟朋友的特点、爱好、背景等"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-success" onclick="saveFriend()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 阿里云RTC SDK -->
    <script src="https://g.alicdn.com/aliyun-rtc-sdk/latest/aliyun-rtc-sdk.min.js"></script>
    <script>
        let currentFriendId = null;
        let friendModal = null;
        let avatarEnabled = false;
        let rtcClient = null;
        let avatarWebSocket = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        
        // 页面加载时检查登录状态并加载好友列表
        window.addEventListener('load', async () => {
            friendModal = new bootstrap.Modal(document.getElementById('friendModal'));
            
            try {
                const response = await fetch('/api/auth/check');
                if (!response.ok) {
                    window.location.href = '/login';
                    return;
                }
                
                loadFriends();
                initAvatarDrag();
            } catch (error) {
                console.error('检查登录状态失败:', error);
                window.location.href = '/login';
            }
        });
        
        // 加载好友列表
        async function loadFriends() {
            try {
                const response = await fetch('/api/friends');
                const friends = await response.json();
                
                const friendList = document.getElementById('friendList');
                friendList.innerHTML = '';
                
                if (friends.length === 0) {
                    friendList.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">暂无好友，点击"添加"按钮创建虚拟朋友</div>';
                    return;
                }
                
                friends.forEach(friend => {
                    const div = document.createElement('div');
                    div.className = 'friend-item';
                    div.dataset.id = friend.id;
                    div.onclick = () => selectFriend(friend.id);
                    div.innerHTML = `
                        <div class="friend-name">${friend.name}</div>
                        <div class="friend-info">${friend.gender || '未知'} · ${friend.age || '?'}岁</div>
                    `;
                    friendList.appendChild(div);
                });
            } catch (error) {
                console.error('加载好友列表失败:', error);
            }
        }
        
        // 选择好友
        async function selectFriend(friendId) {
            currentFriendId = friendId;
            
            // 更新选中状态
            document.querySelectorAll('.friend-item').forEach(item => {
                item.classList.remove('active');
                if (parseInt(item.dataset.id) === friendId) {
                    item.classList.add('active');
                }
            });
            
            // 获取好友信息
            const response = await fetch('/api/friends');
            const friends = await response.json();
            const friend = friends.find(f => f.id === friendId);
            
            // 显示聊天界面
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = `
                <div class="chat-header">
                    <h4>${friend.name}</h4>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <label style="color: white; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" id="useContextSwitch" checked style="width: 16px; height: 16px; cursor: pointer;">
                            <span>连续对话</span>
                        </label>
                        <button class="btn-edit-friend" onclick="toggleAvatar()" id="avatarToggleBtn" style="background: #667eea; color: white; border: none;">
                            <i class="bi bi-camera-video"></i> 数字人
                        </button>
                        <button class="btn-edit-friend" onclick="editFriend(${friend.id})">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                    </div>
                </div>
                <div class="messages-container" id="messagesContainer">
                    <!-- 消息将在这里动态加载 -->
                </div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="输入消息... (发送"帮我生成'场景描述'一段场景的描述"来生成图片)" onkeypress="handleKeyPress(event)">
                    <button class="btn-send" onclick="sendMessage()">发送</button>
                </div>
            `;
            
            // 加载聊天记录
            loadMessages(friendId);
        }
        
        // 加载聊天记录
        async function loadMessages(friendId) {
            try {
                const response = await fetch(`/api/messages/${friendId}`);
                const messages = await response.json();
                
                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';
                
                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message ${msg.sender}`;
                    
                    const time = new Date(msg.timestamp).toLocaleTimeString('zh-CN', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });
                    
                    // 检查是否是图片消息
                    let contentHtml = '';
                    if (msg.messageType === 'image' && msg.imageUrls) {
                        const urls = msg.imageUrls.split(',');
                        contentHtml = `<div style="margin-bottom: 8px; color: #666; font-size: 14px;">${msg.content}</div>`;
                        contentHtml += '<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">';
                        urls.forEach((url, index) => {
                            const trimmedUrl = url.trim();
                            if (trimmedUrl) {
                                contentHtml += `
                                    <div style="position: relative; background: #f0f0f0; border-radius: 8px; overflow: hidden; min-height: 150px;">
                                        <img src="${trimmedUrl}" 
                                             style="width: 100%; height: auto; display: block; cursor: pointer;" 
                                             onclick="window.open('${trimmedUrl}', '_blank')" 
                                             alt="generated image ${index + 1}"
                                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                        <div style="display: none; align-items: center; justify-content: center; height: 150px; color: #999; font-size: 12px; text-align: center; padding: 10px;">
                                            图片加载失败<br><small>点击重试</small>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                        contentHtml += '</div>';
                    } else {
                        contentHtml = msg.content;
                    }
                    
                    div.innerHTML = `
                        <div>
                            <div class="message-bubble">${contentHtml}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
                
                // 滚动到底部
                container.scrollTop = container.scrollHeight;
            } catch (error) {
                console.error('加载消息失败:', error);
            }
        }
        
        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !currentFriendId) return;
            
            const sendBtn = document.querySelector('.btn-send');
            sendBtn.disabled = true;
            input.disabled = true;
            
            // 获取连续对话开关状态
            const useContextSwitch = document.getElementById('useContextSwitch');
            const useContext = useContextSwitch ? useContextSwitch.checked : true;
            
            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        friendId: currentFriendId,
                        content: content,
                        useContext: useContext
                    })
                });
                
                const data = await response.json();
                
                // 清空输入框
                input.value = '';
                
                // 重新加载消息
                await loadMessages(currentFriendId);
                
                // 如果数字人已启用,让数字人播报AI回复
                if (avatarEnabled && data.reply) {
                    await makeAvatarSpeak(data.reply);
                }
            } catch (error) {
                console.error('发送消息失败:', error);
                alert('发送失败，请重试');
            } finally {
                sendBtn.disabled = false;
                input.disabled = false;
                input.focus();
            }
        }
        
        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // 显示添加好友模态框
        function showAddFriendModal() {
            document.getElementById('modalTitle').textContent = '添加好友';
            document.getElementById('friendForm').reset();
            document.getElementById('friendId').value = '';
            friendModal.show();
        }
        
        // 编辑好友
        async function editFriend(friendId) {
            try {
                const response = await fetch('/api/friends');
                const friends = await response.json();
                const friend = friends.find(f => f.id === friendId);
                
                document.getElementById('modalTitle').textContent = '编辑好友';
                document.getElementById('friendId').value = friend.id;
                document.getElementById('friendName').value = friend.name;
                document.getElementById('friendAge').value = friend.age || '';
                document.getElementById('friendGender').value = friend.gender || '男';
                document.getElementById('friendPersonality').value = friend.personality || '';
                document.getElementById('friendCharacteristics').value = friend.characteristics || '';
                
                friendModal.show();
            } catch (error) {
                console.error('获取好友信息失败:', error);
            }
        }
        
        // 保存好友
        async function saveFriend() {
            const friendId = document.getElementById('friendId').value;
            const name = document.getElementById('friendName').value.trim();
            
            if (!name) {
                alert('姓名不能为空');
                return;
            }
            
            const friendData = {
                name: name,
                age: parseInt(document.getElementById('friendAge').value) || null,
                gender: document.getElementById('friendGender').value,
                personality: document.getElementById('friendPersonality').value.trim(),
                characteristics: document.getElementById('friendCharacteristics').value.trim()
            };
            
            try {
                let response;
                if (friendId) {
                    // 更新好友
                    response = await fetch(`/api/friends/${friendId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(friendData)
                    });
                } else {
                    // 添加好友
                    response = await fetch('/api/friends', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(friendData)
                    });
                }
                
                if (response.ok) {
                    friendModal.hide();
                    loadFriends();
                    
                    // 如果正在编辑当前选中的好友，刷新聊天头部
                    if (friendId && currentFriendId == friendId) {
                        selectFriend(parseInt(friendId));
                    }
                } else {
                    alert('保存失败，请重试');
                }
            } catch (error) {
                console.error('保存好友失败:', error);
                alert('保存失败，请重试');
            }
        }
        
        // ========== 数字人相关功能 ==========
        
        // 初始化数字人窗口拖拽
        function initAvatarDrag() {
            const avatarWindow = document.getElementById('avatarWindow');
            const avatarHeader = document.getElementById('avatarHeader');
            
            avatarHeader.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
            
            function startDrag(e) {
                isDragging = true;
                const rect = avatarWindow.getBoundingClientRect();
                dragOffset.x = e.clientX - rect.left;
                dragOffset.y = e.clientY - rect.top;
                avatarWindow.style.cursor = 'grabbing';
            }
            
            function drag(e) {
                if (!isDragging) return;
                
                const x = e.clientX - dragOffset.x;
                const y = e.clientY - dragOffset.y;
                
                // 限制在窗口范围内
                const maxX = window.innerWidth - avatarWindow.offsetWidth;
                const maxY = window.innerHeight - avatarWindow.offsetHeight;
                
                avatarWindow.style.left = Math.max(0, Math.min(x, maxX)) + 'px';
                avatarWindow.style.top = Math.max(0, Math.min(y, maxY)) + 'px';
                avatarWindow.style.right = 'auto';
                avatarWindow.style.bottom = 'auto';
            }
            
            function stopDrag() {
                isDragging = false;
                avatarWindow.style.cursor = 'move';
            }
        }
        
        // 切换数字人显示
        async function toggleAvatar() {
            const avatarWindow = document.getElementById('avatarWindow');
            const toggleBtn = document.getElementById('avatarToggleBtn');
            
            if (!avatarEnabled) {
                // 开启数字人
                avatarWindow.classList.add('show');
                toggleBtn.innerHTML = '<i class="bi bi-camera-video-off"></i> 关闭数字人';
                toggleBtn.style.background = '#dc3545';
                avatarEnabled = true;
                
                // 连接数字人
                await connectAvatar();
            } else {
                // 关闭数字人
                avatarWindow.classList.remove('show');
                toggleBtn.innerHTML = '<i class="bi bi-camera-video"></i> 数字人';
                toggleBtn.style.background = '#667eea';
                avatarEnabled = false;
                
                // 断开连接
                disconnectAvatar();
            }
        }
        
        // 连接数字人
        async function connectAvatar() {
            try {
                updateAvatarStatus('connecting', '正在连接...');
                
                // 获取RTC配置
                const response = await fetch('/api/avatar/config');
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || '获取配置失败');
                }
                
                console.log('RTC配置:', data.rtcConfig);
                
                // TODO: 使用阿里云RTC SDK拉取视频流
                // 这里需要等待您提供真实的RTC app_id和app_key后完善
                
                updateAvatarStatus('connected', '已连接 (等待RTC配置)');
                
                // 显示提示信息
                document.getElementById('avatarPlaceholder').innerHTML = `
                    <i class="bi bi-info-circle" style="font-size: 36px; display: block; margin-bottom: 10px; color: #667eea;"></i>
                    <div style="color: #666; font-size: 13px;">需要配置RTC应用</div>
                    <small style="color: #999; display: block; margin-top: 5px;">
                        请在阿里云控制台创建RTC应用<br>
                        并配置app-id和app-key
                    </small>
                `;
                
            } catch (error) {
                console.error('连接数字人失败:', error);
                updateAvatarStatus('error', '连接失败');
                document.getElementById('avatarPlaceholder').innerHTML = `
                    <i class="bi bi-exclamation-triangle" style="font-size: 36px; display: block; margin-bottom: 10px; color: #dc3545;"></i>
                    <div style="color: #dc3545;">连接失败</div>
                    <small style="color: #999;">${error.message}</small>
                `;
            }
        }
        
        // 断开数字人连接
        function disconnectAvatar() {
            if (rtcClient) {
                // TODO: 离开RTC频道
                rtcClient = null;
            }
            
            if (avatarWebSocket) {
                avatarWebSocket.close();
                avatarWebSocket = null;
            }
            
            updateAvatarStatus('disconnected', '未连接');
            
            // 恢复默认显示
            document.getElementById('avatarPlaceholder').innerHTML = `
                <i class="bi bi-person-video" style="font-size: 48px; display: block; margin-bottom: 10px;"></i>
                <div>数字人视频中...</div>
                <small style="color: #999;">正在连接</small>
            `;
            document.getElementById('avatarVideo').style.display = 'none';
        }
        
        // 最小化数字人窗口
        function minimizeAvatar() {
            const avatarWindow = document.getElementById('avatarWindow');
            const videoContainer = avatarWindow.querySelector('.avatar-video-container');
            
            if (videoContainer.style.display === 'none') {
                videoContainer.style.display = 'flex';
                avatarWindow.style.height = '360px';
            } else {
                videoContainer.style.display = 'none';
                avatarWindow.style.height = 'auto';
            }
        }
        
        // 关闭数字人窗口
        function closeAvatar() {
            if (avatarEnabled) {
                toggleAvatar();
            }
        }
        
        // 更新数字人状态
        function updateAvatarStatus(status, text) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            statusDot.className = 'status-dot';
            if (status === 'connected' || status === 'speaking') {
                statusDot.classList.add('active');
            }
            
            statusText.textContent = text;
        }
        
        // 让数字人说话 (在发送消息后调用)
        async function makeAvatarSpeak(text) {
            if (!avatarEnabled) return;
            
            try {
                updateAvatarStatus('speaking', '正在说话...');
                
                // TODO: 调用TTS生成音频
                // TODO: 通过WebSocket发送音频数据给数字人
                
                console.log('数字人播报:', text);
                
                // 模拟播报完成
                setTimeout(() => {
                    updateAvatarStatus('connected', '已连接');
                }, 2000);
                
            } catch (error) {
                console.error('数字人播报失败:', error);
                updateAvatarStatus('error', '播报失败');
            }
        }
    </script>
</body>
</html>
